name: SIAPNeo
options:
  bundleIdPrefix: com.kemenkeu.bcpriok
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.19.17"
    CURRENT_PROJECT_VERSION: "157"
    GENERATE_INFOPLIST_FILE: NO

targets:
  SIAPNeo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kemenkeu.bcpriok.siapneo.ios
        PRODUCT_NAME: SIAPNeo
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO

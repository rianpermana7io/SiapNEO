name: Build SIAP NEO iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS Release app
        run: |
          xcodebuild \
            -project SIAPNeo.xcodeproj \
            -scheme SIAPNeo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package SIAPNeo-iOS.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SIAPNeo.app Payload/SIAPNeo.app
          codesign --force --sign - --entitlements Resources/SIAPNeo.entitlements Payload/SIAPNeo.app
          zip -qry SIAPNeo-iOS.ipa Payload
          ls -lh SIAPNeo-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIAPNeo-iOS-IPA
          path: SIAPNeo-iOS.ipa
          retention-days: 30

      - name: Publish Direct Release IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)
          TITLE="SIAP NEO iOS v${VER} (${BUILD})"
          NOTES="VERSION=${VER} BUILD=${BUILD} - Automated macos-15 release build"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "${TITLE}" --notes "${NOTES}"
            gh release upload latest SIAPNeo-iOS.ipa --clobber
          else
            gh release create latest SIAPNeo-iOS.ipa --title "${TITLE}" --notes "${NOTES}"
          fi

name: Build SIAP NEO iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS Release app
        run: |
          xcodebuild \
            -project SIAPNeo.xcodeproj \
            -scheme SIAPNeo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package SIAPNeo-iOS.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SIAPNeo.app Payload/SIAPNeo.app
          zip -qry SIAPNeo-iOS.ipa Payload
          ls -lh SIAPNeo-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIAPNeo-iOS-IPA
          path: SIAPNeo-iOS.ipa
          retention-days: 30

name: Build SIAP NEO iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS Release app
        run: |
          xcodebuild \
            -project SIAPNeo.xcodeproj \
            -scheme SIAPNeo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package SIAPNeo-iOS.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SIAPNeo.app Payload/SIAPNeo.app
          codesign --force --sign - --entitlements Resources/SIAPNeo.entitlements Payload/SIAPNeo.app
          zip -qry SIAPNeo-iOS.ipa Payload
          ls -lh SIAPNeo-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIAPNeo-iOS-IPA
          path: SIAPNeo-iOS.ipa
          retention-days: 30

      - name: Publish Direct Release IPA & Update Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)
          SIZE=$(stat -f%z SIAPNeo-iOS.ipa)
          PUB_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TITLE="SIAP NEO iOS v${VER} (${BUILD})"
          CHANGELOG=$(git log -n 5 --pretty=format:"- %s")

          python3 - "$VER" "$BUILD" "$SIZE" "$PUB_AT" "$CHANGELOG" << 'PYEOF'
          import json, sys
          ver, build, size, pub_at, changelog = sys.argv[1:6]
          manifest = {
              "version": ver,
              "build": int(build),
              "ipa_url": "https://github.com/rianpermana7io/SiapNEO/releases/download/latest/SIAPNeo-iOS.ipa",
              "ipa_size_bytes": int(size),
              "published_at": pub_at,
              "mandatory": False,
              "changelog": changelog
          }
          with open("update-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PYEOF

          NOTES="VERSION=${VER} BUILD=${BUILD}

          ${CHANGELOG}"

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "${TITLE}" --notes "${NOTES}"
            gh release upload latest SIAPNeo-iOS.ipa update-manifest.json --clobber
          else
            gh release create latest SIAPNeo-iOS.ipa update-manifest.json --title "${TITLE}" --notes "${NOTES}"
          fi
